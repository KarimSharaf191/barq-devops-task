name: barq-assessment
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: barq-assessment-app:latest
  init: true
  restart: unless-stopped
  stop_grace_period: 10s
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: ${APP_MESSAGE:-Welcome to BARQ Systems}
    # One copy of the credential, supplied from the git-ignored .env file.
    DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    REDIS_URL: redis://redis:6379/0
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 10s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [frontend, backend]
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
      reservations:
        memory: 64M
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # Keep PGDATA in a sub-directory of the mount point: the volume root can
      # carry lost+found and other entries that make initdb refuse to start.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    # AOF every second is the durability/throughput compromise for a counter:
    # at most one second of increments is lost on an unclean stop. The RDB
    # snapshot is kept as a cheap, fast-loading second copy.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --dir
      - /data
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app-01:
    <<: *app
    container_name: app-01
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: nginx
    restart: unless-stopped
    stop_grace_period: 10s
    # 101:101 is the nginx user in the official alpine image. An unprivileged
    # process cannot bind port 80, so nginx.conf listens on 8080 in-container.
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:8080"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    healthcheck:
      # wget ships with the busybox userland already inside nginx:alpine, so the
      # probe adds no packages and no extra attack surface.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # frontend only: the edge proxy has no route to PostgreSQL or Redis.
    networks: [frontend]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data:
