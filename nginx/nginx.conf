# Edge proxy for the BARQ assessment stack.
# Runs unprivileged (compose sets user 101:101) with a read-only root filesystem,
# so the pid file and every temp path live under the tmpfs mounted at /tmp, and
# the listener is above 1024 because an unprivileged process cannot bind port 80.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    client_max_body_size 64k;

    # $request_uri rather than $uri: $uri is the normalised path with the query
    # string stripped, which hides the difference between distinct client
    # requests. $upstream_addr and $upstream_status are comma-separated when a
    # request was retried, which is what makes retries countable while one
    # access-log line still means exactly one client request.
    log_format assessment escape=json
        '{"timestamp":"$time_iso8601","service":"edge","request_id":"$request_id",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_time":"$request_time","client":"$remote_addr"}';
    access_log /dev/stdout assessment;

    upstream application_pool {
        # Shared-memory zone. Without it every worker keeps a private
        # round-robin cursor, so after a reload the first request served by each
        # of the 16 workers goes to the same peer and traffic looks pinned to
        # app-01. Measured and explained in troubleshooting.md entry 13.
        zone application_pool 64k;

        server app-01:8080 max_fails=3 fail_timeout=5s;
        server app-02:8080 max_fails=3 fail_timeout=5s;

        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Liveness of the proxy itself, answered without touching a backend, so
        # a backend outage cannot turn the nginx container healthcheck red.
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 "{\"service\":\"edge\",\"status\":\"alive\"}\n";
        }

        location / {
            proxy_pass http://application_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            # Retry the surviving peer. non_idempotent is deliberately NOT set:
            # a retried POST /records could insert the row twice if the first
            # attempt reached the backend and only the reply was lost. GET and
            # HEAD keep full availability during a backend outage; POST fails
            # fast instead. Trade-off recorded in decisions.md.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            # Must exceed proxy_read_timeout, or the retry budget is already spent
            # by the time the first peer times out and no retry ever happens. With
            # both set to 5s a hung backend returned 504 to the client; measured in
            # evidence/16-paused-backend-behaviour.txt.
            proxy_next_upstream_timeout 12s;
        }
    }
}
